# For workspace name
# The checkpoint file location to be saved: {workspace}/checkpoints/
# The log file location to be saved: {workspace}/tensorboard_logs/
workspace: /New_Volume/number_theory/GeoLayoutLM/modelhub/table_model_oct_31

dataset: custom
dataset_root_path: /New_Volume/number_theory/GeoLayoutLM/datahub/test/preprocessed
task: ee_el
img_h: 768
img_w: 768

seed: 1
cudnn_deterministic: False
cudnn_benchmark: True

model:
  n_classes: 41
  backbone: alibaba-damo/geolayoutlm-large-uncased
  config_json: /New_Volume/number_theory/GeoLayoutLM/configs/GeoLayoutLM/GeoLayoutLM_large_model_config.json
  model_ckpt: geolayoutlm_large_pretrain.pt #epoch.105-f1_labeling.0.9232.pt
  head: vie
  use_inner_id: false
  max_prob_as_father: false
  max_prob_as_father_upperbound: false

train:
  batch_size: 1
  num_samples_per_epoch: 149
  max_seq_length: 512
  max_block_num: 150
  max_epochs: 200
  use_fp16: False
  accelerator: cpu
  strategy:
    type: ""

  clip_gradient_algorithm: norm
  clip_gradient_value: 1.0
  num_workers: 4

  optimizer:
    method: adamw
    params:
      lr: 2e-5
      weight_decay: 0.01
      eps: !!float 1e-8
    lr_schedule:
      method: linear
      params:
        warmup_steps: 200

  val_interval: 1  # in epochs

val:
  batch_size: 1
  num_workers: 4
  limit_val_batches: 1.0
  dump_dir: /New_Volume/number_theory/GeoLayoutLM/results/test_pred_res_oct_31
  pretrained_best_type: labeling # labeling, linking

pretrained_model_file: #geolayoutlm_large_pretrain.pt
